#small note: BAM to count matrix conversion will require an Rscript featureCounts/HTSeq
#have integrating an Rscript into a SnakeMake
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - snakemake-minimal=7.24.0  # Updated version for better compatibility
  - python=3.7
  - fastqc=0.11.9
  - cutadapt=3.5
  - star=2.7.6
  - samtools=1.16.1
  - hisat2=2.2.0
  - htseq=2.0.2
  - subread
  - numpy
  - pandas
  - r-base=4.2